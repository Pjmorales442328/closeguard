{# Characters, top-down, drawn at 1.9x. Idle breathing is ambient; working / walking / stamping poses are set by real events. #}
<g class="robot idle" id="robot" style="transform:translate(415px,116px)">
  <g transform="scale(1.9)">
    <ellipse class="shadow" cx="0" cy="5" rx="23" ry="20"/>
    <g class="bodyg">
      <rect class="arm l" x="-27" y="-5" width="9" height="19" rx="4.5"/><rect class="arm r" x="18" y="-5" width="9" height="19" rx="4.5"/>
      <rect class="body" x="-19" y="-17" width="38" height="34" rx="12"/>
      <rect class="visor" x="-13" y="2" width="26" height="9" rx="4.5"/><circle class="eye" cx="-6" cy="6.5" r="2.2"/><circle class="eye" cx="6" cy="6.5" r="2.2"/>
      <circle class="ant" cx="0" cy="-18" r="3.4"/>
    </g>
  </g>
  <text class="tag" x="58" y="4">the agent</text>
</g>
<g class="person" id="maria" style="transform:translate(855px,322px)">
  <g transform="scale(1.9)">
    <ellipse class="shadow" cx="0" cy="4" rx="25" ry="14"/>
    <ellipse class="jacket" cx="0" cy="3" rx="22" ry="12"/>
    <g class="hand"><rect class="sleeve" x="13" y="-17" width="8" height="17" rx="4"/><rect class="stamp" x="10.5" y="-27" width="13" height="10" rx="2"/></g>
    <circle class="head" cx="0" cy="0" r="9.5"/><path class="hair" d="M-9.5 0a9.5 9.5 0 0 1 19 0c-3-3.5-16-3.5-19 0z"/>
  </g>
  <text class="tag" x="0" y="58" text-anchor="middle">Maria, controller</text>
</g>
<g class="person guard" id="guard" style="transform:translate(640px,298px)">
  <g transform="scale(1.5)">
    <ellipse class="shadow" cx="0" cy="4" rx="21" ry="12"/><ellipse class="coat" cx="0" cy="3" rx="19" ry="10.5"/>
    <circle class="head" cx="0" cy="0" r="8.5"/><rect class="cap" x="-9" y="-9" width="18" height="9" rx="4"/><rect class="visor" x="-7" y="-11" width="14" height="4" rx="2"/>
    <circle class="badge" cx="10" cy="6" r="3"/>
  </g>
</g>
<g class="person ana {{ 'relieved' if sc and sc.verified else '' }}" id="ana" style="transform:translate(60px,303px)">
  <g transform="scale(1.3)">
    <ellipse class="shadow" cx="0" cy="4" rx="20" ry="12"/><ellipse class="cardigan" cx="0" cy="3" rx="18" ry="10"/>
    <circle class="head" cx="0" cy="0" r="8.5"/><path class="hair" d="M-8.5 0a8.5 8.5 0 0 1 17 0c-3-3-14-3-17 0z"/><circle class="hair" cx="0" cy="-10" r="3.6"/>
  </g>
  <g class="pile"><rect x="34" y="-14" width="22" height="26" rx="2" class="paper" transform="rotate(8 45 -1)"/><rect x="36" y="-16" width="22" height="26" rx="2" class="paper"/><rect x="38" y="-18" width="22" height="26" rx="2" class="paper"/></g>
  <g class="mug"><circle cx="46" cy="-2" r="10"/><circle cx="46" cy="-2" r="6" class="coffee"/><rect x="55" y="-5" width="6" height="6" rx="3"/></g>
  <text class="tag" x="72" y="5">Ana, bookkeeper</text>
</g>
<g class="guard-light" id="guard-light"><circle cx="640" cy="178" r="11"/><text x="640" y="212" text-anchor="middle" class="tag">{{ n_rules }} rules</text></g>
